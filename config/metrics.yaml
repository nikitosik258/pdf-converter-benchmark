evaluation:
  # Overall Quality Score.
  # Equal weights are the primary benchmark result.
  overall_weights:
    text: 0.16666666666666666
    table: 0.16666666666666666
    math: 0.16666666666666666
    chemistry: 0.16666666666666666
    image: 0.16666666666666666
    diagram: 0.16666666666666666

  # Prompt-5 uncertainty policy.
  bootstrap_resamples: 10000
  bootstrap_seed: 42

  # A required category must not disappear because a tool lacks support.
  # Such objects must enter evaluation as prediction=null and receive zero-ish
  # scores. Therefore missing categories are considered an input error.
  strict_overall_categories: true

weights_reference:
  text:
    cer_score: 0.40
    wer_score: 0.30
    edit_similarity: 0.10
    reading_order: 0.20

  table:
    cell_f1: 0.30
    cell_content: 0.25
    structure: 0.20
    teds_like: 0.25

  math:
    raw_exact_match: 0.05
    normalized_exact_match: 0.35
    token_f1: 0.40
    edit_similarity: 0.20

  chemistry_linear:
    normalized_exact_match: 0.35
    token_f1: 0.30
    edit_similarity: 0.20
    composition_similarity: 0.15

  chemistry_structure:
    detection: 0.30
    iou: 0.25
    label_f1: 0.25
    extraction: 0.20

  image:
    detection: 0.30
    iou: 0.25
    extraction: 0.25
    caption: 0.20

  diagram:
    detection: 0.20
    iou: 0.15
    diagram_text_f1: 0.25
    caption: 0.15
    key_elements: 0.25
